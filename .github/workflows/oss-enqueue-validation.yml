name: Fork Optuna Enqueue QA

on:
  push:
    branches:
      - qa/enqueue-regression-6895
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enqueue-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and QA tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff scipy
      - name: Ruff checks
        run: |
          python -m ruff check optuna/study/study.py tests/study_tests/test_study.py
          python -m ruff format --check optuna/study/study.py tests/study_tests/test_study.py
      - name: Enqueue regression tests
        run: |
          python -m pytest -q tests/study_tests/test_study.py -k 'enqueue_trial_skip_existing' --tb=short
